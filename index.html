<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="DesbravaClube: o app do clube de Desbravadores — jornada, gestão e documentos oficiais pelo celular." />
    <title>DesbravaClube</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DesbravaClube" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="DesbravaClube — o clube na palma da mão" />
    <meta property="og:description" content="Classes, avaliações, documentos com QR Code, mensalidades e comunicação do Clube de Desbravadores, tudo pelo celular." />
    <meta property="og:url" content="https://desbravaclube.com.br/" />
    <meta property="og:image" content="https://desbravaclube.com.br/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Emblema do DesbravaClube" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Aplica o tema salvo ANTES de renderizar (evita "flash" de tema errado).
      try {
        var t = localStorage.getItem('tema');
        if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
        else if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
