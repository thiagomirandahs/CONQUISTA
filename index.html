<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07122f" />
    <link rel="stylesheet" href="/abertura.css" />
    <meta name="description" content="DesbravaClube: plataforma para gestão, desenvolvimento e conexão dos Clubes de Desbravadores. Classes, avaliações, documentos com QR Code, gestão do clube e Rede DBV, pelo celular." />
    <link rel="canonical" href="https://desbravaclube.com.br/" />
    <title>DesbravaClube</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DesbravaClube" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="DesbravaClube — plataforma para Clubes de Desbravadores" />
    <meta property="og:description" content="Gestão, desenvolvimento e conexão dos Clubes de Desbravadores: classes, avaliações, documentos com QR Code, gestão do clube e Rede DBV, pelo celular." />
    <meta property="og:url" content="https://desbravaclube.com.br/" />
    <meta property="og:image" content="https://desbravaclube.com.br/og-desbravaclube.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DesbravaClube em um celular: tela Minha Classe, com o progresso por requisito." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DesbravaClube — plataforma para Clubes de Desbravadores" />
    <meta name="twitter:description" content="Gestão, desenvolvimento e conexão dos Clubes de Desbravadores, pelo celular." />
    <meta name="twitter:image" content="https://desbravaclube.com.br/og-desbravaclube.png" />
    <script>
      // Aplica o tema salvo ANTES de renderizar (evita "flash" de tema errado).
      try {
        var t = localStorage.getItem('tema');
        if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
        else if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
      // Acessibilidade (src/lib/acessibilidade.js): letra e alto contraste ANTES do app subir.
      try {
        var a = JSON.parse(localStorage.getItem('acessibilidade') || '{}');
        var esc = { pequena: '90%', grande: '115%', enorme: '130%' }[a.fonte];
        if (esc) document.documentElement.style.fontSize = esc;
        if (a.alto_contraste === true) document.documentElement.setAttribute('data-contraste', 'alto');
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Abertura (sem JS): o mesmo visual de <TelaDeAbertura/>; sai com fade quando o app pinta. -->
    <div id="abertura" role="status" aria-label="Abrindo o DesbravaClube">
      <div class="ab-emblema"><img src="/icon-192.png" alt="" width="96" height="96" /></div>
      <p class="ab-nome">DesbravaClube</p>
      <p class="ab-lema">Seu clube na palma da mão</p>
      <div class="ab-barra" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <!-- vigia: se o app não iniciar em 15 s, a abertura mostra "Tentar de novo" (fase 7). Arquivo do mesmo domínio: a CSP já permite -->
    <script src="/vigia-abertura.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
