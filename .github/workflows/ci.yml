name: CI

# Roda em todo push e em toda Pull Request. O deploy só deve ser considerado
# seguro se este CI passar (lint + testes + build).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22   # o undici (via vitest/jsdom) exige Node 22 — com 20 os workers do vitest nem sobem
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificação completa (lint + testes + build)
        run: npm run check
        env:
          # O build não precisa das chaves reais (o app cai no fallback);
          # valores de teste bastam pra compilar.
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-de-teste-ci
