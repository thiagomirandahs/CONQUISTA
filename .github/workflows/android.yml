name: Montar APK Android

# Roda ao clicar em "Run workflow" (aba Actions) OU ao empurrar uma tag de
# versão (ex.: v1.0.0). Numa tag, além do APK nos Artifacts, cria uma RELEASE
# com link PÚBLICO de download (bom pra mandar no grupo).
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # pra criar a Release com o APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Montar o site (modo app nativo — sem service worker/legado)
        run: npm run build:cap
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Sincronizar Capacitor (Android)
        run: npx cap sync android

      - name: Preparar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Preparar a chave de assinatura
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/conquista.keystore"

      # versionName do APK. Em tag (v1.3.8) é a própria tag. No "Run workflow" (sem tag) o ref_name é "main": esse nome
      # virava versão nativa "0" no app e o OTA recusava TODA atualização ("precisa APK novo") — achado de 02/10/2026.
      # Aqui o nome vira <otaMinimoNativo>-ci<execução> (ex.: 1.3.0-ci41), sempre numérico e >= ao mínimo do OTA.
      - name: Definir a versão do APK
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="$GITHUB_REF_NAME"; else V="$(node -p "require('./package.json').desbravaclube.otaMinimoNativo")-ci${GITHUB_RUN_NUMBER}"; fi
          echo "nome=$V" >> "$GITHUB_OUTPUT"
          echo "versionName do APK: $V"

      - name: Montar o APK (assinado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=${{ steps.ver.outputs.nome }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/conquista.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publicar o APK (baixe aqui nos "Artifacts")
        uses: actions/upload-artifact@v4
        with:
          name: desbravaclube-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar Release com link público (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DesbravaClube ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            📲 **APK do DesbravaClube** (${{ github.ref_name }}).
            Baixe o `app-release.apk` abaixo e instale no Android
            (permita "instalar de fontes desconhecidas").
