<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b4bbd"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#13265c"/>
    </linearGradient>
    <linearGradient id="agulha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd24a"/>
      <stop offset="50%" stop-color="#f5b800"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe4ff"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#fundo)"/>

  <!-- anel da bússola -->
  <circle cx="512" cy="512" r="290" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="16"/>
  <circle cx="512" cy="512" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10"/>

  <!-- marcas dos quatro pontos cardeais -->
  <g fill="#ffffff" fill-opacity="0.55">
    <rect x="500" y="196" width="24" height="52" rx="12"/>
    <rect x="500" y="776" width="24" height="52" rx="12"/>
    <rect x="196" y="500" width="52" height="24" rx="12"/>
    <rect x="776" y="500" width="52" height="24" rx="12"/>
  </g>

  <!-- a agulha: losango alongado, metade amarela (norte) e metade branca (sul) -->
  <path d="M512 244 L588 512 L512 780 L436 512 Z" fill="url(#agulha)"/>
  <!-- travessa curta, para a agulha não virar um simples losango -->
  <path d="M512 452 L680 512 L512 572 L344 512 Z" fill="#ffffff" fill-opacity="0.30"/>
  <circle cx="512" cy="512" r="42" fill="#13265c"/>
  <circle cx="512" cy="512" r="20" fill="#ffffff"/>
</svg>